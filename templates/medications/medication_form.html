<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add medication | Trackly</title>
</head>
<body>
    <main>
        <h1>Add Medication Manually</h1>
        {% for message in messages %}
            <p role="status">{{ message }}</p>
        {% endfor %}
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Save Medication</button>
        </form>
        <p><a href="{% url 'accounts:dashboard' %}">Back to dashboard</a></p>
    </main>
</body>
</html>
