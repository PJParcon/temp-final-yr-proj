<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in | Trackly</title>
</head>
<body>
    <main>
        <h1>Log in</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit">Log in</button>
        </form>
        <p>Need an account? <a href="{% url 'accounts:register' %}">Create an account</a></p>
    </main>
</body>
</html>
